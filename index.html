<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Tic-Tac-Toe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        /* Mode Selector Tabs */
        .grid-selector {
            display: flex;
            background: #1e293b;
            padding: 4px;
            border-radius: 12px;
            width: 100%;
            border: 1px solid #334155;
        }

        .grid-btn {
            flex: 1;
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        /* Scoreboard */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .score-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }

        .score-card.active-x {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            background: #1e293b;
        }

        .score-card.active-o {
            border-color: #f43f5e;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.25);
            background: #1e293b;
        }

        .score-title {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Canvas Container */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #334155;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none; /* Crucial for immediate, glitch-free touch interactions */
        }

        /* Status & Controls */
        .status {
            font-size: 1.05rem;
            font-weight: 600;
            color: #cbd5e1;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        button.action-btn {
            flex: 1;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 13px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.action-btn:active {
            transform: scale(0.97);
        }

        button.secondary {
            background-color: #334155;
            color: #f8fafc;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tic-Tac-Toe Pro</h1>

        <!-- Grid Selector -->
        <div class="grid-selector">
            <button class="grid-btn active" data-size="3">3 x 3</button>
            <button class="grid-btn" data-size="4">4 x 4</button>
            <button class="grid-btn" data-size="5">5 x 5</button>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-card" id="card-x">
                <div class="score-title">Player X</div>
                <div class="score-value" id="score-x">0</div>
            </div>
            <div class="score-card" id="card-draw">
                <div class="score-title">Draws</div>
                <div class="score-value" id="score-draw">0</div>
            </div>
            <div class="score-card" id="card-o">
                <div class="score-title">Player O</div>
                <div class="score-value" id="score-o">0</div>
            </div>
        </div>

        <!-- Status Message -->
        <div class="status" id="statusText">Player X's Turn</div>

        <!-- Canvas Game Board -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="action-btn secondary" id="resetScoreBtn">Reset Scores</button>
            <button class="action-btn" id="resetBoardBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        
        const scoreXEl = document.getElementById('score-x');
        const scoreOEl = document.getElementById('score-o');
        const scoreDrawEl = document.getElementById('score-draw');
        const cardX = document.getElementById('card-x');
        const cardO = document.getElementById('card-o');
        const gridBtns = document.querySelectorAll('.grid-btn');

        let GRID_SIZE = 3; // Default 3x3
        let WIN_COUNT = 3; // Number of items in a row required to win
        let board = [];
        let currentPlayer = 'X';
        let isGameActive = true;
        let winningLine = null;

        let scores = {
            X: 0,
            O: 0,
            draw: 0
        };

        function initBoard() {
            board = Array(GRID_SIZE * GRID_SIZE).fill('');
            winningLine = null;
            isGameActive = true;
            currentPlayer = 'X';
            statusText.textContent = `Player X's Turn`;
            updateScoreboardUI();
            resizeCanvas();
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            drawGame();
        }

        function updateScoreboardUI() {
            scoreXEl.textContent = scores.X;
            scoreOEl.textContent = scores.O;
            scoreDrawEl.textContent = scores.draw;

            cardX.classList.remove('active-x');
            cardO.classList.remove('active-o');

            if (isGameActive) {
                if (currentPlayer === 'X') {
                    cardX.classList.add('active-x');
                } else {
                    cardO.classList.add('active-o');
                }
            }
        }

        function handleInput(e) {
            e.preventDefault();
            if (!isGameActive) return;

            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.clientX !== undefined) {
                clientX = e.clientX;
                clientY = e.clientY;
            } else {
                return;
            }

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const boxSize = rect.width / GRID_SIZE;
            const col = Math.floor(x / boxSize);
            const row = Math.floor(y / boxSize);

            if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return;

            const index = row * GRID_SIZE + col;

            if (board[index] === '') {
                board[index] = currentPlayer;
                checkResult();
                if (isGameActive) {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    statusText.textContent = `Player ${currentPlayer}'s Turn`;
                }
                updateScoreboardUI();
                drawGame();
            }
        }

        function checkWinCondition(size, winLen) {
            // Check Rows
            for (let r = 0; r < size; r++) {
                for (let c = 0; c <= size - winLen; c++) {
                    let first = board[r * size + c];
                    if (!first) continue;
                    let win = true;
                    let line = [];
                    for (let i = 0; i < winLen; i++) {
                        let idx = r * size + (c + i);
                        line.push(idx);
                        if (board[idx] !== first) {
                            win = false;
                            break;
                        }
                    }
                    if (win) return { winner: first, line };
                }
            }

            // Check Columns
            for (let c = 0; c < size; c++) {
                for (let r = 0; r <= size - winLen; r++) {
                    let first = board[r * size + c];
                    if (!first) continue;
                    let win = true;
                    let line = [];
                    for (let i = 0; i < winLen; i++) {
                        let idx = (r + i) * size + c;
                        line.push(idx);
                        if (board[idx] !== first) {
                            win = false;
                            break;
                        }
                    }
                    if (win) return { winner: first, line };
                }
            }

            // Check Diagonal (Top-Left to Bottom-Right)
            for (let r = 0; r <= size - winLen; r++) {
                for (let c = 0; c <= size - winLen; c++) {
                    let first = board[r * size + c];
                    if (!first) continue;
                    let win = true;
                    let line = [];
                    for (let i = 0; i < winLen; i++) {
                        let idx = (r + i) * size + (c + i);
                        line.push(idx);
                        if (board[idx] !== first) {
                            win = false;
                            break;
                        }
                    }
                    if (win) return { winner: first, line };
                }
            }

            // Check Diagonal (Top-Right to Bottom-Left)
            for (let r = 0; r <= size - winLen; r++) {
                for (let c = winLen - 1; c < size; c++) {
                    let first = board[r * size + c];
                    if (!first) continue;
                    let win = true;
                    let line = [];
                    for (let i = 0; i < winLen; i++) {
                        let idx = (r + i) * size + (c - i);
                        line.push(idx);
                        if (board[idx] !== first) {
                            win = false;
                            break;
                        }
                    }
                    if (win) return { winner: first, line };
                }
            }

            return null;
        }

        function checkResult() {
            const result = checkWinCondition(GRID_SIZE, WIN_COUNT);

            if (result) {
                scores[result.winner]++;
                isGameActive = false;
                winningLine = result.line;
                statusText.textContent = `Player ${result.winner} Wins! 🎉`;
                cardX.classList.remove('active-x');
                cardO.classList.remove('active-o');
                return;
            }

            if (!board.includes('')) {
                scores.draw++;
                isGameActive = false;
                statusText.textContent = `It's a Draw!`;
                cardX.classList.remove('active-x');
                cardO.classList.remove('active-o');
                return;
            }
        }

        function drawGridLines() {
            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);
            const step = width / GRID_SIZE;

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = GRID_SIZE === 3 ? 4 : 3;
            ctx.lineCap = 'round';

            // Vertical lines
            for (let i = 1; i < GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(step * i, 10);
                ctx.lineTo(step * i, height - 10);
                ctx.stroke();
            }

            // Horizontal lines
            for (let i = 1; i < GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(10, step * i);
                ctx.lineTo(width - 10, step * i);
                ctx.stroke();
            }
        }

        function drawX(x, y, size) {
            const padding = size * 0.28;
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = GRID_SIZE === 3 ? 7 : (GRID_SIZE === 4 ? 6 : 5);
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(x + padding, y + padding);
            ctx.lineTo(x + size - padding, y + size - padding);
            ctx.moveTo(x + size - padding, y + padding);
            ctx.lineTo(x + padding, y + size - padding);
            ctx.stroke();
        }

        function drawO(x, y, size) {
            const radius = (size / 2) * 0.62;
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = GRID_SIZE === 3 ? 7 : (GRID_SIZE === 4 ? 6 : 5);

            ctx.beginPath();
            ctx.arc(x + size / 2, y + size / 2, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawWinningLine() {
            if (!winningLine || winningLine.length === 0) return;

            const width = canvas.width / (window.devicePixelRatio || 1);
            const step = width / GRID_SIZE;
            
            const startIdx = winningLine[0];
            const endIdx = winningLine[winningLine.length - 1];

            const startCol = startIdx % GRID_SIZE;
            const startRow = Math.floor(startIdx / GRID_SIZE);
            const endCol = endIdx % GRID_SIZE;
            const endRow = Math.floor(endIdx / GRID_SIZE);

            const startX = startCol * step + step / 2;
            const startY = startRow * step + step / 2;
            const endX = endCol * step + step / 2;
            const endY = endRow * step + step / 2;

            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawGridLines();

            const width = canvas.width / (window.devicePixelRatio || 1);
            const step = width / GRID_SIZE;

            for (let i = 0; i < board.length; i++) {
                const col = i % GRID_SIZE;
                const row = Math.floor(i / GRID_SIZE);
                const x = col * step;
                const y = row * step;

                if (board[i] === 'X') {
                    drawX(x, y, step);
                } else if (board[i] === 'O') {
                    drawO(x, y, step);
                }
            }

            if (!isGameActive && winningLine) {
                drawWinningLine();
            }
        }

        function resetScores() {
            scores = { X: 0, O: 0, draw: 0 };
            initBoard();
        }

        // Event Listeners for Touch and Click
        canvas.addEventListener('touchstart', handleInput, { passive: false });
        canvas.addEventListener('click', handleInput);

        document.getElementById('resetBoardBtn').addEventListener('click', initBoard);
        document.getElementById('resetScoreBtn').addEventListener('click', resetScores);

        // Grid Size Selection
        gridBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                gridBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                GRID_SIZE = parseInt(e.target.getAttribute('data-size'));
                // Win count rule: 3 for 3x3, 4 for 4x4 and 5x5
                WIN_COUNT = GRID_SIZE === 3 ? 3 : 4; 
                
                initBoard();
            });
        });

        window.addEventListener('load', initBoard);
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
